server:
  port: 8888

spring:
  application:
    name: CONFIG-SERVER
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: "*"