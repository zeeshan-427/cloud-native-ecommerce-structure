apiVersion: apps/v1
kind: Deployment

metadata:
  name: review-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: review-service

  template:
    metadata:
      labels:
        app: review-service

    spec:
      containers:
        - name: review-service
          image: review-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8089

          env:
            - name: EUREKA_URL
              value: "http://service-registry:8761/eureka"

            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"