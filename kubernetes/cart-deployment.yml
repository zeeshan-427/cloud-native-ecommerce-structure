apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
        - name: cart-service
          image: cart-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8086

          env:
            - name: EUREKA_URL
              value: "http://service-registry:8761/eureka"

            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"