apiVersion: apps/v1
kind: Deployment

metadata:
  name: vendor-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vendor-service

  template:
    metadata:
      labels:
        app: vendor-service

    spec:
      containers:
        - name: vendor-service
          image: vendor-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8083

          env:
            - name: EUREKA_URL
              value: "http://service-registry:8761/eureka"

            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"