apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: payment-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8088

          env:
            - name: EUREKA_URL
              value: "http://service-registry:8761/eureka"

            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"