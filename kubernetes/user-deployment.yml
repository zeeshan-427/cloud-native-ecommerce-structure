apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: zeeshan427/user-service:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: EUREKA_URL
              value: "http://service-registry:8761/eureka"

            - name: CONFIG_SERVER_URL
              value: "http://config-server:8888"