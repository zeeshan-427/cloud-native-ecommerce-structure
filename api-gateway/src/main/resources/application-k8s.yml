spring:
  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/users/**

        - id: vendor-service
          uri: http://vendor-service:8083
          predicates:
            - Path=/vendors/**

        - id: product-service
          uri: http://product-service:8084
          predicates:
            - Path=/products/**

        - id: inventory-service
          uri: http://inventory-service:8085
          predicates:
            - Path=/inventory/**

        - id: cart-service
          uri: http://cart-service:8086
          predicates:
            - Path=/cart/**

        - id: order-service
          uri: http://order-service:8087
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: http://payment-service:8088
          predicates:
            - Path=/payments/**

        - id: review-service
          uri: http://review-service:8089
          predicates:
            - Path=/reviews/**

        - id: notification-service
          uri: http://notification-service:8090
          predicates:
            - Path=/notifications/**
logging:
  level:
    org.springframework.cloud.gateway: TRACE