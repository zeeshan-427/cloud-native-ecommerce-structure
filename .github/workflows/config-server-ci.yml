name: Config Server CI

on:
  push:
    paths:
      - 'config-server/**'
      - 'pom.xml'
      - '.github/workflows/config-server-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Config Server
        run: mvn -pl config-server -am clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t zeeshan427/config-server:${{ github.sha }} \
            -t zeeshan427/config-server:latest \
            ./config-server

      - name: Push Docker Images
        run: |
          docker push zeeshan427/config-server:${{ github.sha }}
          docker push zeeshan427/config-server:latest