name: API Gateway CI

on:
  push:
    paths:
      - 'api-gateway/**'
      - 'pom.xml'
      - '.github/workflows/api-gateway-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build API Gateway
        run: mvn -pl api-gateway -am clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t zeeshan427/api-gateway:${{ github.sha }} \
            -t zeeshan427/api-gateway:latest \
            ./api-gateway

      - name: Push Docker Images
        run: |
          docker push zeeshan427/api-gateway:${{ github.sha }}
          docker push zeeshan427/api-gateway:latest