name: Service Registry CI

on:
  push:
    paths:
      - 'service-registry/**'
      - 'pom.xml'
      - '.github/workflows/service-registry-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Service Registry
        run: mvn -pl service-registry -am clean install -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t zeeshan427/service-registry:${{ github.sha }} \
            -t zeeshan427/service-registry:latest \
            ./service-registry

      - name: Push Docker Images
        run: |
          docker push zeeshan427/service-registry:${{ github.sha }}
          docker push zeeshan427/service-registry:latest