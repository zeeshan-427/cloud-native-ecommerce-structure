    container_name: vendor-service-container
    ports:
      - "8083:8083"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888

  product-service:
    image: product-service:latest
    container_name: product-service-container
    ports:
      - "8084:8084"
